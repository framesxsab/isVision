name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pwa:
    name: PWA — typecheck, tests, build (with env-leak guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Guard against VITE_*-prefixed secrets
        run: npm run check-env

      - name: Tests
        run: npm test

      - name: Build (also re-runs the env-leak check via prebuild)
        run: npm run build

  a11y:
    name: PWA — accessibility regression (axe-core via Playwright)
    runs-on: ubuntu-latest
    needs: pwa
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pwa/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build (preview server reads dist/)
        run: npm run build

      - name: Run axe-core suite against every route
        run: npm run test:a11y

  bridge:
    name: OS bridge — protocol, braille, tactile_serve (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python test suite
        run: python -m unittest discover -s tests
