name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pwa:
    name: PWA — typecheck, tests, build (with env-leak guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Guard against VITE_*-prefixed secrets
        run: npm run check-env

      - name: Tests
        run: npm test

      - name: Build (also re-runs the env-leak check via prebuild)
        run: npm run build
