name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pwa:
    name: PWA — typecheck, tests, build (with env-leak guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Guard against VITE_*-prefixed secrets
        run: npm run check-env

      - name: Tests
        run: npm test

      - name: Tests with coverage
        run: npm run test:coverage 2>/dev/null || npx vitest run --coverage 2>/dev/null || echo "coverage skipped"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info,./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build (also re-runs the env-leak check via prebuild)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist-${{ github.sha }}
          path: pwa/dist
          retention-days: 7

  a11y:
    name: PWA — accessibility regression (axe-core via Playwright)
    runs-on: ubuntu-latest
    needs: pwa
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pwa/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build (preview server reads dist/)
        run: npm run build

      - name: Run axe-core suite against every route
        run: npm run test:a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: pwa/playwright-report
          retention-days: 7

  bridge:
    name: OS bridge — protocol, braille, tactile_serve (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python test suite
        run: python -m unittest discover -s tests

      - name: Upload Python coverage (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-${{ github.sha }}
          path: coverage.xml
          retention-days: 7
