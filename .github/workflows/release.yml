name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, test, and attach release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PWA deps
        working-directory: pwa
        run: npm ci

      - name: Build PWA
        working-directory: pwa
        run: npm run build

      - name: Unit tests (vitest)
        working-directory: pwa
        run: npm test

      - name: Bridge tests (Python)
        run: python -m unittest discover -s tests

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist-${{ github.ref_name }}
          path: pwa/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pwa/dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
