name: Bug report
description: Something in isVisible is broken or behaves incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Clear reproduction steps and the assistive technology you used help us reproduce and fix the problem faster.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps starting from a fresh page load where possible.
      placeholder: |
        1. Open ...
        2. Activate ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including anything a screen reader announced incorrectly or failed to announce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      description: Browser name and version plus operating system.
      placeholder: e.g. Chrome 131 on Windows 11
    validations:
      required: true
  - type: dropdown
    id: screen-reader
    attributes:
      label: Screen reader used
      description: Pick the assistive technology active when the bug happened.
      options:
        - Not applicable
        - NVDA
        - JAWS
        - Narrator
        - VoiceOver (macOS / iOS)
        - TalkBack
        - Orca
        - Other (describe in Actual behavior)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and console output
      description: Console errors, network failures, or relevant log excerpts. Redact any personal data first.
      render: shell
    validations:
      required: false
